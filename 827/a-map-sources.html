#dev.phone .x-grid{grid-template-columns:1fr}#dev.phone .x-cl{padding:12px}#dev.phone .x-smodal{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-width:100%;max-height:92dvh;border-radius:16px 16px 0 0}
#dev.phone .x-msrow2{grid-template-columns:1fr}#dev.phone .x-tr{grid-template-columns:32px minmax(0,1fr);row-gap:6px}#dev.phone .x-tr>span:nth-child(n+3){grid-column:2}#dev.phone .x-th{display:none}
#dev.phone .x-bar{flex-direction:column;align-items:stretch}#dev.phone .x-bar .sp{display:none}#dev.phone .x-bar .x-btn{width:100%}
</style></head><body><div class="mockbar"><a href="../">All mocks</a> · #827 Category filters on multi-advisor send · <a href="index.html">Hub</a> · <b>A: MAP sources</b> · <a href="b-categories.html">B: Categories</a> · <a href="c-chips.html">C: Tri-state chips</a> · <a href="build-contract.html">Contract</a><span class="sp"></span><span class="grp"><button data-dev="desk" onclick="setDev('desk')">Desktop</button><button data-dev="phone" onclick="setDev('phone')">Phone</button></span><span class="row2">Preset: <button data-sb="preset:defaults" onclick="set('preset','defaults')">defaults</button><button data-sb="preset:include" onclick="set('preset','include')">include-only</button><button data-sb="preset:exclude" onclick="set('preset','exclude')">exclude-only</button><button data-sb="preset:both" onclick="set('preset','both')">both</button><button data-sb="preset:nomatch" onclick="set('preset','nomatch')">no matches</button><button data-sb="preset:blocked" onclick="set('preset','blocked')">blocked in other</button><button data-sb="preset:clear" onclick="set('preset','clear')">cleared</button></span></div><div id="dev" class="desk"><div id="flow"></div></div><div class="toast" id="toast"></div><script>
var S=S||{};function qs(s){return document.querySelectorAll(s)}
function setDev(d){document.getElementById('dev').className=d;qs('[data-dev]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-dev')===d)})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},2800)}
function apply(){Object.keys(S).forEach(function(k){qs('[data-'+k+']').forEach(function(e){e.style.display=e.getAttribute('data-'+k).split(' ').indexOf(String(S[k]))>-1?'':'none'})});
 qs('[data-sb]').forEach(function(b){var p=b.getAttribute('data-sb').split(':');b.classList.toggle('on',String(S[p[0]])===p[1])});
 if(window.onApply)onApply();}
function set(k,v){S[k]=v;apply();var d=document.getElementById('dev');if(k==='v'){d.scrollTop=0;window.scrollTo(0,0)}}
function openOv(id){document.getElementById(id).classList.add('show')}function closeOv(id){document.getElementById(id).classList.remove('show')}
function initBase(){var q=location.search;setDev(/[?&]phone/.test(q)?'phone':'desk');Object.keys(S).forEach(function(k){var m=q.match(new RegExp('[?&]'+k+'=([a-z0-9]+)'));if(m)S[k]=m[1]});apply()}
S={preset:'defaults',inc:'content',exc:'nlac',open:''};var DIR='a';var CATS=[
 {id:'content',n:'Content'},
 {id:'email',n:'Email Content'},
 {id:'compliance',n:'Compliance'},
 {id:'social',n:'Social'},
 {id:'nlac',n:'No longer a client'}
];
var ADV=[
 {id:'jane',n:'Jane Advisor',f:'Your Firm Name',e:'jane.advisor@example.com',cats:['content','email','compliance','social'],tags:['Social - Main','Email content','Compliance'],arch:0},
 {id:'john',n:'John Advisor',f:'Example Wealth',e:'john@example.com',cats:['content','social'],tags:['Social - Basic'],arch:0},
 {id:'casey',n:'Casey Example',f:'Example Planning',e:'casey@example.com',cats:['content'],tags:['Website'],arch:0},
 {id:'sam',n:'Sam Planner',f:'Sample Advisory',e:'sam@example.com',cats:['content','email'],tags:['Email content'],arch:0},
 {id:'pat',n:'Pat Example',f:'Your Firm Name',e:'pat@example.com',cats:['content','social','compliance'],tags:['Social','Compliance'],arch:0},
 {id:'lee',n:'Lee Example',f:'Example Partners',e:'lee@example.com',cats:['content','email'],tags:['Email content'],arch:0},
 {id:'riley',n:'Riley Example',f:'Example Wealth',e:'riley@example.com',cats:['content','nlac'],tags:['No longer a client'],arch:0},
 {id:'archived',n:'Archived Example',f:'Example Planning',e:'archived@example.com',cats:['content'],tags:['Archive'],arch:1}
];
var SEL={};
var POST={t:'November market update',ex:'Markets moved a lot this month.',url:'https://yourfirm.ca/insights/november-market-update'};
function catName(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i].n;return id}
function parseList(k){return (S[k]||'').split(',').filter(Boolean)}
function setList(k,arr){S[k]=arr.join(',');pruneSel();render()}
function inc(){return parseList('inc')}
function exc(){return parseList('exc')}
function has(arr,id){return arr.indexOf(id)>-1}
function toast(m){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},2400)}
function set(k,v){S[k]=v;if(k==='preset')applyPreset(v);pruneSel();render()}
function applyPreset(p){
  if(p==='defaults'){S.inc='content';S.exc='nlac';S.open=''}
  else if(p==='include'){S.inc='email';S.exc='';S.open='inc'}
  else if(p==='exclude'){S.inc='content';S.exc='compliance';S.open='exc'}
  else if(p==='both'){S.inc='content,email';S.exc='nlac';S.open=''}
  else if(p==='nomatch'){S.inc='compliance';S.exc='content';S.open=''}
  else if(p==='clear'){S.inc='';S.exc='';S.open=''}
  else if(p==='blocked'){S.inc='content';S.exc='nlac';S.open='exc'}
}
function matches(a){
  if(a.arch)return false;
  var I=inc(),E=exc();
  if(I.length){
    var ok=false;for(var i=0;i<a.cats.length;i++)if(has(I,a.cats[i])){ok=true;break}
    if(!ok)return false;
  }
  if(E.length){
    for(var j=0;j<a.cats.length;j++)if(has(E,a.cats[j]))return false;
  }
  return true;
}
function visible(){return ADV.filter(matches)}
function pruneSel(){ADV.forEach(function(a){if(!matches(a))SEL[a.id]=0})}
function selList(){return visible().filter(function(a){return SEL[a.id]})}
function toggle(id){if(!matches(A(id)))return;SEL[id]=SEL[id]?0:1;render()}
function all(v){visible().forEach(function(a){SEL[a.id]=v});render()}
function A(id){return ADV.filter(function(a){return a.id===id})[0]}
function tags(a){return a.tags.map(function(t){return '<span class="x-tag">'+t+'</span>'}).join('')}
function pill(k,t){return '<span class="x-pill '+k+'">'+t+'</span>'}

function toggleSide(side,id){
  var I=inc().slice(),E=exc().slice();
  if(side==='inc'){
    if(has(I,id))I=I.filter(function(x){return x!==id});
    else{I.push(id);E=E.filter(function(x){return x!==id})}
  }else{
    if(has(E,id))E=E.filter(function(x){return x!==id});
    else{E.push(id);I=I.filter(function(x){return x!==id})}
  }
  S.inc=I.join(',');S.exc=E.join(',');pruneSel();render();
}
function cycleChip(id){
  var I=inc(),E=exc();
  if(has(I,id)){ /* include -> exclude */ I=I.filter(function(x){return x!==id});E.push(id) }
  else if(has(E,id)){ /* exclude -> off */ E=E.filter(function(x){return x!==id}) }
  else{ /* off -> include */ I.push(id);E=E.filter(function(x){return x!==id}) }
  S.inc=I.join(',');S.exc=E.join(',');pruneSel();render();
}

function filterSummary(){
  var I=inc(),E=exc(),v=visible().length;
  var bits=[];
  if(I.length)bits.push('Include: '+I.map(catName).join(', '));
  else bits.push('Include: all categories');
  if(E.length)bits.push('Exclude: '+E.map(catName).join(', '));
  else bits.push('Exclude: none');
  return '<div class="x-fsum">'+bits.join(' · ')+' · <b>'+v+' shown</b> <span class="x-mut">(archive always hidden)</span></div>';
}

function multiSelect(side,label){
  var cur=side==='inc'?inc():exc();
  var other=side==='inc'?exc():inc();
  var open=S.open===side;
  var h='<div class="x-ms"><label class="x-mslab">'+label+'</label>';
  h+='<button type="button" class="x-msbtn" aria-expanded="'+(open?'true':'false')+'" onclick="set(\'open\',S.open===\''+side+'\'?\'\':\''+side+'\')">'+(cur.length?cur.map(catName).join(', '):'Select…')+' <span class="x-mut">▾</span></button>';
  if(open){
    h+='<div class="x-msdd" role="listbox">';
    CATS.forEach(function(c){
      var blocked=has(other,c.id);
      var on=has(cur,c.id);
      h+='<label class="x-msrow'+(blocked?' blocked':'')+(on?' on':'')+'"><input type="checkbox" '+(on?'checked':'')+' '+(blocked?'disabled':'')+' onchange="toggleSide(\''+side+'\',\''+c.id+'\')"><span>'+c.n+'</span>'+(blocked?'<small>In '+(side==='inc'?'exclude':'include')+'</small>':'')+'</label>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function chipsFilter(){
  var h='<div class="x-chips"><span class="x-chlab">Categories <small class="x-mut">tap: off → include → exclude</small></span><div class="x-chrow">';
  CATS.forEach(function(c){
    var st=has(inc(),c.id)?'inc':has(exc(),c.id)?'exc':'off';
    var lab=st==='inc'?'Include':st==='exc'?'Exclude':'Off';
    h+='<button type="button" class="x-chip '+st+'" onclick="cycleChip(\''+c.id+'\')" aria-label="'+c.n+' '+lab+'"><b>'+c.n+'</b><span>'+lab+'</span></button>';
  });
  return h+'</div></div>';
}

function filters(){
  if(DIR==='c')return '<div class="x-filt"><div class="x-fh">Who appears in the list</div>'+chipsFilter()+filterSummary()+'</div>';
  var il=DIR==='b'?'Include categories':'Include sources';
  var el=DIR==='b'?'Exclude categories':'Exclude sources';
  return '<div class="x-filt"><div class="x-fh">Who appears in the list</div><div class="x-msrow2">'+multiSelect('inc',il)+multiSelect('exc',el)+'</div>'+filterSummary()+'</div>';
}

function search(){return '<div class="x-sr"><input class="x-in" placeholder="Search by name, email, firm or tag" aria-label="Search advisors"></div>'}

function pickRows(){
  var list=visible();
  if(!list.length){
    return '<div class="x-empty"><p><b>No advisors match these filters</b></p><p>Widen include, clear exclude, or reset to defaults.</p><button class="x-btn o" onclick="set(\'preset\',\'defaults\')">Reset filters</button></div>';
  }
  var h='<div class="x-tbl"><div class="x-tr x-th"><span><input type="checkbox" aria-label="Select all visible" onchange="all(this.checked?1:0)" '+(selList().length&&selList().length===list.length?'checked':'')+'></span><span>Advisor</span><span>Categories</span><span>Products</span></div>';
  list.forEach(function(a){
    h+='<label class="x-tr'+(SEL[a.id]?' on':'')+'"><span><input type="checkbox" '+(SEL[a.id]?'checked':'')+' onchange="toggle(\''+a.id+'\')" aria-label="'+a.n+'"></span><span><b>'+a.n+'</b><small>'+a.f+' · '+a.e+'</small></span><span>'+a.cats.map(function(c){return '<span class="x-tag">'+catName(c)+'</span>'}).join('')+'</span><span>'+tags(a)+'</span></label>';
  });
  return h+'</div>';
}

function postCard(){
  return '<div class="x-pc"><div class="x-ph"></div><div><b>'+POST.t+'</b><p>'+POST.ex+'</p><small>'+POST.url+'</small></div></div>';
}

function modal(){
  var h='<div class="x-scrim" onclick="toast(&quot;Closes modal&quot;)"></div><div class="x-smodal" role="dialog" aria-label="Send to multiple advisors">';
  h+='<div class="x-smh"><div><b>Send to multiple advisors</b><small>HTML post · pick who gets it. Filters narrow the checklist (same rules as MAP).</small></div><button class="x-x" aria-label="Close" onclick="toast(&quot;Closes modal&quot;)">×</button></div>';
  h+=postCard();
  h+='<div class="x-steps"><span class="n">1 Advisors</span><span>2 Extras</span><span>3 Review</span></div>';
  h+='<div class="x-card">'+filters()+search()+pickRows()+'</div>';
  h+='<div class="x-bar"><span>'+selList().length+' selected of '+visible().length+' shown</span><span class="sp"></span><button class="x-btn o" onclick="toast(&quot;Back to Content&quot;)">Cancel</button><button class="x-btn" onclick="toast(&quot;Continues to extras (unchanged from #824)&quot;)"'+(selList().length?'':' disabled')+'>Next</button></div>';
  h+='</div>';
  return h;
}

function gridBehind(){
  return '<div class="x-cl dim"><div class="x-clh"><b>Content</b><span class="x-mut">Library</span></div><div class="x-grid"><div class="x-cardpost on"><div class="x-ph tall"></div><div class="x-cpb"><b>'+POST.t+'</b><p>'+POST.ex+'</p><div class="x-act"><button class="x-web">Website</button><button class="x-share">Share ▾</button></div></div></div></div></div>';
}

function render(){
  var root=document.getElementById('flow');
  if(!root)return;
  root.innerHTML=gridBehind()+modal();
}
window.onApply=function(){
  if(typeof S.inc==='undefined')S.inc='content';
  if(typeof S.exc==='undefined')S.exc='nlac';
  if(S.preset)applyPreset(S.preset);
  if(!window._selInit){ADV.forEach(function(a){SEL[a.id]=matches(a)?1:0});window._selInit=1}
  else pruneSel();
  render();
};
var _sd=setDev;setDev=function(d){_sd(d);render()};

initBase();</script></body></html>
