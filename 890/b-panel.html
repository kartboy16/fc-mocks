<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>#890 B: Admin delivery panel on the existing report</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<div class="mockbar">
  <a href="../">All mocks</a> · <a href="index.html">#890 hub</a> · <a href="a-tab.html">A</a> ·
  <b>B: Admin panel</b> · <a href="c-log.html">C</a> · <a href="today.html">Today</a> ·
  <a href="build-contract.html">Contract</a>
  <span class="sp"></span>
  <button type="button" data-sw="dev:desk" onclick="sw('dev','desk')">Desktop</button>
  <button type="button" data-sw="dev:phone" onclick="sw('dev','phone')">390</button>
  <button type="button" data-sw="who:admin" onclick="sw('who','admin')">Admin impersonating</button>
  <button type="button" data-sw="who:advisor" onclick="sw('who','advisor')">Advisor view</button>
  <button type="button" data-sw="s:report" onclick="sw('s','report')">Report + panel</button>
  <button type="button" data-sw="s:drawer" onclick="sw('s','drawer')">Drawer</button>
  <button type="button" data-sw="s:history" onclick="sw('s','history')">Subscriber History</button>
  <button type="button" data-sw="s:empty" onclick="sw('s','empty')">Empty</button>
  <button type="button" data-sw="s:loading" onclick="sw('s','loading')">Loading</button>
  <button type="button" data-sw="s:error" onclick="sw('s','error')">Error</button>
</div>
<div id="root"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
var S = { dev: "desk", who: "admin", s: "report", open: 1, q: "", status: "all", bounce: "all", domain: "all", pageSize: 25, page: 1, expand: "pat.client@outlook.example", histEmail: "pat.client@outlook.example" };

function readQ() {
  var q = new URLSearchParams(location.search);
  if (q.get("phone") === "1" || q.get("dev") === "phone") S.dev = "phone";
  if (q.get("who") === "advisor") S.who = "advisor";
  if (["report","drawer","history","empty","loading","error"].indexOf(q.get("s")) >= 0) S.s = q.get("s");
  if (q.get("open") === "0") S.open = 0;
  if (q.get("open") === "1") S.open = 1;
  if (q.get("status")) S.status = q.get("status");
  if (q.get("q")) S.q = q.get("q");
  if (q.get("ps")) S.pageSize = q.get("ps");
  if (q.get("page")) S.page = Number(q.get("page")) || 1;
  if (q.has("expand")) S.expand = q.get("expand");
  if (q.get("email")) S.histEmail = q.get("email");
}
function writeQ() {
  var u = new URL(location.href);
  var p = u.searchParams;
  p.delete("phone");
  ["s","who","open","status","q","ps","page","expand","email"].forEach(function (k) { p.delete(k); });
  p.set("s", S.s); p.set("who", S.who);
  if (S.dev === "phone") p.set("phone", "1");
  if (S.s === "report") p.set("open", String(S.open));
  if (S.expand) p.set("expand", S.expand);
  if (S.s === "history") p.set("email", S.histEmail);
  history.replaceState(null, "", u);
}
function sw(k, v) {
  S[k] = v;
  if (k === "s" && (v === "report" || v === "empty" || v === "loading" || v === "error")) { S.open = 1; S._drawer = 0; }
  if (k === "s" && v === "drawer") { S.s = "report"; S.open = 0; S._drawer = 1; }
  if (k === "s" && v !== "drawer" && v !== "empty" && v !== "loading" && v !== "error" && v !== "report") S._drawer = 0;
  if (k === "s" && v === "history") S.histEmail = "pat.client@outlook.example";
  render();
}
function togglePanel() { S.open = S.open ? 0 : 1; S._drawer = 0; S.s = "report"; render(); }
function openDrawer() { S._drawer = 1; S.s = "report"; render(); }
function closeDrawer() { S._drawer = 0; render(); }

FC890App.onFilter = function () {
  S.q = (document.getElementById("q") || {}).value || "";
  S.status = (document.getElementById("st") || {}).value || "all";
  S.bounce = (document.getElementById("bt") || {}).value || "all";
  S.domain = (document.getElementById("dm") || {}).value || "all";
  S.pageSize = (document.getElementById("ps") || {}).value || 25;
  S.page = 1;
  render();
};
FC890App.setPage = function (p) { S.page = p; render(); };
FC890App.toggle = function (email) { S.expand = S.expand === email ? "" : email; render(); };
FC890App.openHistory = function (email) { S.s = "history"; S.histEmail = email; render(); };

function panelInner() {
  if (S.s === "loading") return `<div class="ld"><span class="spin"></span><div style="margin-top:10px">Loading delivery details…</div></div>`;
  if (S.s === "error") return `<div class="er"><div class="al">Couldn’t load delivery details. Campaign stats above are unchanged.</div><button class="btn" type="button" onclick="sw('s','report')">Try again</button></div>`;
  if (S.s === "empty") return `<div class="note warn">No SES delivery events have been recorded for this campaign yet. If it was just sent, wait for the SNS webhook. If it was sent a while ago, the webhook may not have been received.</div><div class="emp">No delivery events yet</div>`;
  return `${FC890App.countStats()}
    <div class="note">Times are SES event times, not the send time.</div>
    ${FC890App.filters(S)}
    <div id="list"></div>`;
}

function dialog() {
  var admin = S.who !== "advisor";
  var C = FC890.CAMPAIGN;
  if (S.s === "history") {
    return `<div class="scrim"><div class="dlg" role="dialog" aria-label="Subscriber History">
      <div class="dh"><div>Subscriber History: ${S.histEmail}
        <div class="sub">${admin ? FC890App.badge() : "Opens and clicks only"}</div></div></div>
      <div class="db">${admin ? FC890App.historyBody(S.histEmail) : `<p class="hint">The advisor sees opens and clicks only. Delivery events are not loaded.</p><div class="emp">Open and click events only, as they are today.</div>`}</div>
      <div class="df"><button class="btn ghost" type="button" onclick="S.s='report';render()">Back to report</button><button class="btn ghost" type="button">Close</button></div>
    </div></div>`;
  }
  var panel = "";
  if (admin) {
    panel = `<div class="panel">
      <button class="ph" type="button" onclick="togglePanel()" aria-expanded="${S.open? "true":"false"}">
        ${FC890App.badge()}
        <strong style="flex:1">Delivery details</strong>
        <span class="hint" style="margin:0">${S.open ? "Hide" : "Show"} the paged subscriber list</span>
        <span>${S.open ? "▴" : "▾"}</span>
      </button>
      <div class="pb" ${S.open ? "" : "hidden"}>
        ${S.open || S.s === "empty" || S.s === "loading" || S.s === "error" ? panelInner() : ""}
        <p class="hint" style="margin-top:8px"><button class="link" type="button" onclick="openDrawer()" style="background:none;border:0;color:#1976d2;cursor:pointer;padding:0;min-height:32px">Open as a drawer instead</button> — same data, less scrolling on the report.</p>
      </div>
    </div>`;
  }
  var drawer = (admin && S._drawer) ? `<div class="drawer" role="dialog" aria-label="Delivery details">
    <div class="dh">${FC890App.badge()} Delivery details<button class="x" type="button" onclick="closeDrawer()" aria-label="Close">×</button></div>
    <div class="db">${panelInner()}</div>
  </div>` : "";
  return `<div class="scrim"><div class="dlg" role="dialog" aria-label="Campaign report">
    <div class="dh"><div>Campaign Report: ${C.name}
      <div class="sub">${C.subject}<br>Audience: ${C.audience} · Sent ${C.sentAt}${admin ? " · " + FC890App.badge() : ""}</div>
    </div></div>
    <div class="db">
      ${FC890App.reportStats()}
      ${panel || `<p class="hint">Advisor view — the report is unchanged. There is no delivery panel, and no delivery data is sent to this client.</p>`}
      <div class="tabs"><div class="tab on">Opens (${C.uniqueOpens})</div><div class="tab">Clicks (${C.uniqueClicks})</div><div class="tab">Bounces (${C.bounced})</div><div class="tab">Recipients (${C.sent.toLocaleString()})</div></div>
      <p class="hint">Existing Opens / Clicks / Bounces / Recipients tabs stay where they are. Delivery details sit in the admin panel above them, so the tab bar does not change.</p>
    </div>
    <div class="df"><button class="btn ghost" type="button">Close</button></div>
  </div>${drawer}</div>`;
}

function render() {
  writeQ();
  document.getElementById("root").innerHTML = FC890App.shell({ dev: S.dev, who: S.who, body: dialog() });
  document.getElementById("stage").className = S.dev;
  if (window.FC890App && FC890App.afterRender) FC890App.afterRender();
  document.querySelectorAll("[data-sw]").forEach(function (b) {
    var p = b.getAttribute("data-sw").split(":");
    var on = (p[0] === "s" && p[1] === "drawer") ? !!S._drawer : (p[0] === "s" && p[1] === "report") ? (S.s === "report" && !S._drawer) : String(S[p[0]]) === p[1];
    b.classList.toggle("on", on);
  });
  document.querySelectorAll("#list").forEach(function (list) { FC890App.renderList(list, S); });
}
readQ();
render();
</script>
</body>
</html>
