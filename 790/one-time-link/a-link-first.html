function set(k,v){S[k]=v;apply();var d=document.getElementById('dev');if(k==='v'){d.scrollTop=0;window.scrollTo(0,0)}}
function openOv(id){document.getElementById(id).classList.add('show')}function closeOv(id){document.getElementById(id).classList.remove('show')}
function initBase(){var q=location.search;setDev(/[?&]phone/.test(q)?'phone':'desk');Object.keys(S).forEach(function(k){var m=q.match(new RegExp('[?&]'+k+'=([a-z0-9]+)'));if(m)S[k]=m[1]});apply()}
S={v:'page',s:'start',cd:'1'};var DIR='a';var MASK='j***@example.com';
var SUBJ='November newsletter: Planning your retirement income';
function summary(){return '<div class="l-sum"><div class="l-h6">'+SUBJ+'</div><div class="l-mut">Goes to Clients (Newsletter) &middot; 142 people on the list</div><div class="l-mut">From Jane Advisor</div></div>'}
function alert(k,h){return '<div class="l-al '+k+'">'+h+'</div>'}
function cd(){return S.cd==='1'?'<button class="l-btn o" disabled>Resend in 0:42</button>':'<button class="l-btn o" onclick="set(\'cd\',\'1\');toast(\'Sent another link\')">Resend</button>'}
function startA(){return '<div class="l-h5">Your OK</div>'+summary()+
 '<p class="l-p">You&rsquo;re not signed in. We can email a one-time link to the email on this account, so you can approve without a password.</p>'+
 '<button class="l-btn" onclick="set(\'s\',\'sent\')">Email me a one-time approve link</button>'+
 '<div class="l-alt">Have a password? <a class="l-lk" href="javascript:toast(\'Opens sign-in, then comes back here\')">Sign in instead</a></div>'}
function startB(){return '<div class="l-h5">Your OK</div>'+summary()+
 '<div class="l-card"><div class="l-h6">Sign in to approve</div><div class="l-tf"><label>Email</label><input placeholder="you@example.com"></div><div class="l-tf"><label>Password</label><input type="password" value=""></div><button class="l-btn w" onclick="toast(\'Signs in, then shows Approve\')">Sign in</button><a class="l-lk sm" href="javascript:toast(\'Opens Forgot password\')">Forgot password?</a></div>'+
 '<div class="l-or"><span>or</span></div><button class="l-btn o w" onclick="set(\'s\',\'sent\')">Email me a one-time approve link</button><div class="l-alt c">We send it to the email on this account.</div>'}
function startC(){return '<div class="l-h5">Your OK</div>'+summary()+
 '<p class="l-p">You&rsquo;re not signed in. We can email a 6-digit code to the email on this account. Enter it here to approve.</p>'+
 '<button class="l-btn" onclick="set(\'s\',\'sent\')">Email me a code</button>'+
 '<div class="l-alt">Have a password? <a class="l-lk" href="javascript:toast(\'Opens sign-in, then comes back here\')">Sign in instead</a></div>'}
function sentAB(){return '<div class="l-h5">Check your inbox</div>'+alert('ok','We sent a link to <b>'+MASK+'</b>. Open it on any device to review and approve. It works once and expires in about 1 hour.')+
 '<div class="l-row">'+cd()+'<span class="l-mut">Not there? Check spam or promotions.</span></div>'+
 '<div class="l-alt">Not your email anymore? <a class="l-lk" href="javascript:toast(\'Opens sign-in\')">Sign in</a> or contact support.</div>'}
function sentC(){var wrong=S.s==='wrong';return '<div class="l-h5">Enter your code</div>'+alert('ok','We sent a 6-digit code to <b>'+MASK+'</b>. It expires in about 1 hour.')+
 '<div class="l-tf"><label>6-digit code</label><input class="l-code'+(wrong?' er':'')+'" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="'+(wrong?'48217':'')+'" aria-label="6-digit code"></div>'+(wrong?'<div class="l-fe">That code didn&rsquo;t match. 4 tries left.</div>':'')+
 '<button class="l-btn w" onclick="set(\'s\',\'review\')">Continue</button><div class="l-row">'+cd()+'<span class="l-mut">Not there? Check spam or promotions.</span></div>'}
function review(){return '<div class="l-h5">Your OK</div><div class="l-note">&#128274; Signed in for this campaign only</div>'+summary()+
 '<p class="l-p">Nothing is approved until you click Approve.</p><div class="l-row"><button class="l-btn g" onclick="set(\'s\',\'done\')">Approve</button><button class="l-btn o" onclick="toast(\'Opens the decline flow\')">Decline</button></div>'}
function done(){return '<div class="l-h5">Your OK</div>'+alert('ok','Campaign approved. Thank you!')+'<div class="l-alt">This link no longer works. <a class="l-lk" href="javascript:toast(\'Opens sign-in\')">Sign in</a> to see your campaigns.</div>'}
function expired(){var used=S.s==='used';var noun=DIR==='c'?'code':'link';return '<div class="l-h5">'+(used?'This '+noun+' was already used':'This '+noun+' has expired')+'</div>'+summary()+
 alert('wn',used?'Each '+noun+' works once. If you still need to approve, get a new one.':'For your security, '+noun+'s expire after about 1 hour.')+
 '<button class="l-btn" onclick="set(\'s\',\'sent\')">Send a new '+noun+'</button><div class="l-alt c">We send it to the email on this account.</div>'}
function email(){var c=DIR==='c';
 return '<div class="e-meta"><div><b>From:</b> Email approvals &lt;approvals@example.com&gt;</div><div><b>To:</b> jane@example.com</div><div><b>Subject:</b> '+(c?'Your approval code: 482193':'Your one-time approve link')+'</div></div>'+
 '<div class="e-wrap"><div class="e-hd">'+(c?'Your approval code':'Your one-time approve link')+'</div><div class="e-bd"><p>Hi Jane, you asked to approve this campaign without signing in.</p>'+
 '<table class="e-t"><tr><td>Campaign</td><td><b>'+SUBJ+'</b></td></tr><tr><td>List</td><td><b>Clients (Newsletter)</b></td></tr></table>'+
 (c?'<div class="e-code">482 193</div><p class="e-sm">Enter this code on the approval page. It works once and expires in about 1 hour.</p>'
   :'<p><a class="e-btn" href="#" onclick="S.v=\'page\';set(\'s\',\'review\');return false">Open the review page</a></p><p class="e-sm">Opens the page where you click Approve. Nothing is approved until then. This link works once and expires in about 1 hour.</p>')+
 '<p class="e-sm">Didn&rsquo;t ask for this? You can ignore this email. Nobody can approve without this '+(c?'code':'link')+'.</p></div></div>'}
function render(){var h;
 if(S.v==='email')h='<div class="e-pg">'+email()+'</div>';
 else{var s=S.s,b;
  if(s==='start')b=DIR==='a'?startA():DIR==='b'?startB():startC();
  else if(s==='sent'||s==='wrong')b=DIR==='c'?sentC():sentAB();
  else if(s==='review')b=review();else if(s==='done')b=done();else b=expired();
  h='<div class="l-top"><span class="l-brand">Content library</span></div><div class="l-ct">'+b+'</div>'}
 document.getElementById('flow').innerHTML=h}
window.onApply=render;var _sd=setDev;setDev=function(d){_sd(d);render()};

initBase();</script></body></html>
