S={t:'0',ws:'connecting',ed:'0',pv:'0'};var DIR='b';var D='yourfirm.ca';

function consentQ(){return '<div class="o-q"><b>Are these your current clients, or people who asked to hear from you?</b> <span class="o-ph">PLACEHOLDER: CASL wording</span><div class="o-qr"><button class="btn c" onclick="consent()">Current clients</button><button class="btn" onclick="consent()">Asked to hear from me</button><button class="btn" onclick="consent()">A mix / not sure</button></div></div>'}

 if(t<3)h+='<div class="o-mute">Drop a headshot, bio or disclaimer, or tell me about yourself.</div>';
 if(t===4)h+='<div class="o-q"><b>Who do you like to help?</b> Tell me in your own words.<div class="o-qr"><button class="btn c" onclick="talk()">&#127908; Talk</button><button class="btn" onclick="talk()">Type instead</button></div></div>';
 return h}

 else h+='<div class="o-row"><span class="o-k">Facebook</span><span class="o-v">Your Firm Name</span>'+src('You said yes','b')+'</div>';

function msgs(compact){var t=T(),o=[];
 var prog=['Reading '+D,'Pulling your logo, colours and fonts','Finding your social profiles','Getting your website ready'];

 if(t>=1)o.push(A('All done. I pulled your logo, colours and fonts from '+D+', plus your phone and office address.<br><br><b>Your website:</b> we&rsquo;ll connect it for you. Nothing to do on your side.<br><br>I found your LinkedIn. One question: is this Facebook page you?'+(compact?'':'<div class="o-is"><span class="o-pic"></span><span><b>Your Firm Name</b><br><span class="o-mute">Facebook page &middot; 312 followers</span></span></div>')+(t===1?'<div class="o-qr"><button class="btn c" onclick="yesme()">Yes, that&rsquo;s me</button><button class="btn" onclick="yesme(1)">Not me</button></div>':'')));
 if(t>=2){o.push(U('Yes, that&rsquo;s me'));o.push(A('Saved. Anything else? Drop your headshot, bio, disclaimer, client list or any document here, or just tell me.'+(t===2?'<div class="o-qr"><button class="btn c" onclick="dropDemo()">&#128206; Drop 5 files (demo)</button></div>':'')))}
 if(t>=3){o.push(U('<div class="o-files">'+['headshot.jpg','bio.docx','disclaimer.pdf','brochure.pdf','clients.csv'].map(function(f){return '<span class="o-file">&#128196; '+f+'</span>'}).join('')+'</div>'));
  o.push(A('Here&rsquo;s where I put them:<ul class="o-pl"><li>headshot.jpg &rarr; your profile photo</li><li>bio.docx &rarr; About you</li><li>disclaimer.pdf &rarr; your disclaimer, shown under every post</li><li>brochure.pdf &rarr; saved to your Documents</li><li>clients.csv &rarr; 142 contacts for your email list (3 duplicates removed)</li></ul>One question about your list: are these your current clients, or people who asked to hear from you? <span class="o-ph">PLACEHOLDER: CASL wording</span>'+(t===3?'<div class="o-qr"><button class="btn c" onclick="consent()">Current clients</button><button class="btn" onclick="consent()">Asked to hear from me</button><button class="btn" onclick="consent()">A mix / not sure</button></div>':'')))}
 if(t>=4){o.push(U('Current clients'));o.push(A('Thanks, they&rsquo;re in your email list. Last one: who do you like to help? Say it in your own words. Tap the mic or type.'+(t===4?'<div class="o-qr"><button class="btn c" onclick="talk()">&#127908; Talk</button><button class="btn" onclick="talk()">Type instead</button></div>':'')))}
 if(t>=5){o.push(U('&#127908; &ldquo;Mostly young families and small business owners around Vancouver.&rdquo;'));o.push(A('Got it. Who you help: young families and small business owners in Vancouver, BC. I added it to About you.'+(t===5?'<div class="o-qr"><button class="btn c" onclick="set(\'t\',\'6\')">That&rsquo;s everything</button><button class="btn" onclick="toast(\'Tell me more anytime\')">Add something else</button></div>':'')))}
 if(t>=6)o.push(A('<b>You&rsquo;re all set.</b> Everything is in one place. Change anything anytime by telling me, or tap Edit.'+(DIR!=='c'?'<div class="o-qr"><button class="btn c" onclick="toast(\'Opens your content\')">See my first posts</button></div>':'')));
