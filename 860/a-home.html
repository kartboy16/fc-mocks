<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%232b7de9' width='16' height='16' rx='3'/%3E%3C/svg%3E">
<title>#860 Advisor home — key numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>

:root{
  --navy:#1e2a4a; --blue:#2b7de9; --blue-h:#4a96e0; --bg:#f4f8fc; --ink:#1e2a4a; --muted:#5b6b80;
  --card:#fff; --line:#e4edf6;
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.greeting{font-family:Fraunces,Georgia,serif;font-weight:600}
.mockbar{background:#1f2a44;color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;position:sticky;top:0;z-index:50}
.mockbar a{color:#cfe3ff}.mockbar .sp{flex:1}
.mockbar button{background:#33415f;color:#fff;border:0;border-radius:4px;padding:6px 10px;min-height:32px;cursor:pointer;font:inherit}
.mockbar button.on{background:var(--blue)}
.banner{background:#f8f1d4;color:#6b5a16;text-align:center;font-size:12.5px;padding:8px 12px;border-bottom:1px solid #efe3b8}
.app{display:flex;min-height:calc(100vh - 68px)}
.side{width:232px;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:20px 16px 16px;flex-shrink:0}
.brand{font-family:Fraunces,Georgia,serif;font-size:18px;font-weight:600;margin:0 8px 28px;letter-spacing:.01em}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#d7deea;padding:11px 14px;border-radius:12px;font:500 15px "DM Sans",sans-serif;cursor:pointer;margin-bottom:4px}
.nav button.on{background:var(--blue);color:#fff}
.nav button:hover:not(.on){background:rgba(255,255,255,.06)}
.ico{width:18px;text-align:center;font-size:15px}
.side .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);margin-top:12px}
.av{width:32px;height:32px;border-radius:50%;background:#3d4d73;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.who span{font-size:13.5px}
.menu{display:none;margin:8px;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 14px;min-height:44px;font:600 14px "DM Sans",sans-serif;cursor:pointer}
.main{flex:1;padding:48px 32px 80px;position:relative;display:flex;flex-direction:column;align-items:center}
.home{width:min(640px,100%);margin:auto;text-align:center;padding-bottom:48px}
.greeting{font-size:44px;line-height:1.15;margin:0 0 28px;color:var(--navy);letter-spacing:-.02em}
.ask{display:flex;align-items:center;background:#fff;border:1px solid #e8eef5;border-radius:999px;box-shadow:0 8px 28px rgba(30,42,74,.08);padding:6px 8px 6px 20px;margin:0 0 16px}
.ask input{flex:1;border:0;outline:none;font:16px "DM Sans",sans-serif;background:transparent;min-height:44px;color:var(--ink)}
.ask input::placeholder{color:#8a97a8}
.mic{width:44px;height:44px;border:0;background:transparent;border-radius:50%;cursor:pointer;color:#7b8aa0;font-size:18px}
.mic:hover,.mic.on{color:var(--blue);background:#eef5ff}
.cta{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:16px;padding:16px 20px;min-height:56px;font:600 18px "DM Sans",sans-serif;cursor:pointer;box-shadow:0 10px 24px rgba(43,125,233,.28)}
.cta:hover{background:var(--blue-h)}
.hint{margin:14px 0 0;color:var(--muted);font-size:14px}
.foot{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#9aa6b5;font-size:12.5px}
.card{width:min(680px,100%);background:#fff;border-radius:24px;padding:28px 32px 22px;box-shadow:0 16px 40px rgba(30,42,74,.08);margin:auto}
.kicker{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}
.sublab{font-size:12.5px;color:var(--muted);margin:0 0 4px}
.subj{font-family:Fraunces,Georgia,serif;font-size:26px;line-height:1.3;margin:0 0 18px;font-weight:600;hyphens:none;overflow-wrap:normal}
.piece{display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.piece:first-of-type{border-top:1px solid var(--line)}
.pill{display:inline-block;background:#eaf2fd;color:var(--blue);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.piece h3{margin:0 0 4px;font:600 16px "DM Sans",sans-serif}
.piece p{margin:0;color:var(--muted);font-size:14px}
.swap{background:none;border:0;color:var(--blue);font:600 13px "DM Sans",sans-serif;cursor:pointer;padding:6px 0;min-height:36px;white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.btn{border-radius:12px;padding:12px 16px;min-height:44px;font:600 15px "DM Sans",sans-serif;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff;border:0}.btn.primary:hover{background:var(--blue-h)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid #d5deea}
.note{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.status{display:inline-block;background:#eef5ff;color:var(--blue);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.alert{background:#eef5ff;border:1px solid #c5dbf5;border-radius:12px;padding:16px;text-align:center}
.bad{background:#fdecea;border:1px solid #f5c2c0;border-radius:12px;padding:16px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:60}
@media(max-width:700px){
  .side{display:none}.side.open{display:flex;position:fixed;inset:auto 0 0 0;top:68px;z-index:40;width:100%;height:auto;flex-direction:column}
  .menu{display:block}
  .main{padding:24px 16px 72px}
  .greeting{font-size:32px}
  .subj{font-size:22px}
  .piece{grid-template-columns:1fr;gap:6px}
  .actions .btn{flex:1}
}


.home{width:min(680px,100%)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin:0 0 22px;text-align:left}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:0 8px 24px rgba(30,42,74,.06);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.stat:hover{border-color:#c5dbf5}
.stat .v{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:600;line-height:1.15;margin:0 0 4px;color:var(--navy);letter-spacing:-.02em}
.stat .l{font-size:12px;font-weight:600;color:var(--muted)}
.stat .s{font-size:11.5px;color:#8a97a8;margin-top:4px}
.stat.empty .v{color:#9aa6b5}
.mod{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:0 0 22px;text-align:left;box-shadow:0 8px 24px rgba(30,42,74,.06);width:100%}
.mod .kicker{margin-bottom:8px}
.mod h3{margin:0 0 4px;font:600 16px "DM Sans",sans-serif}
.mod p{margin:0;color:var(--muted);font-size:14px}
.mod .meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0 0;font-size:13px;color:var(--muted)}
.mod .meta b{color:var(--navy);font-weight:600}
.mod .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sk{background:linear-gradient(90deg,#e8eef5 25%,#f7fafc 50%,#e8eef5 75%);background-size:200% 100%;animation:sh 1.1s infinite;border-radius:10px;height:22px}
.sk.lg{height:32px;width:70%}
.sk.tile{height:64px;border-radius:16px}
@keyframes sh{to{background-position:-200% 0}}
.errbox{background:#fdecea;border:1px solid #f5c2c0;border-radius:16px;padding:16px 18px;text-align:left;margin:0 0 22px;width:100%}
.errbox h3{margin:0 0 4px;font:600 16px "DM Sans",sans-serif}
.errbox p{margin:0 0 10px;color:var(--muted);font-size:14px}
@media(max-width:700px){
  .strip{grid-template-columns:1fr 1fr}
  .stat .v{font-size:22px}
}

</style>
</head>
<body>
<div class="mockbar"><a href="index.html">#860</a> · <b>A: Home + numbers</b> · <a href="build-contract.html">Contract</a>
<span class="sp"></span>
<button data-s="home" onclick="show('home')">ready</button>
<button data-s="empty" onclick="show('empty')">no data</button>
<button data-s="loading" onclick="show('loading')">loading</button>
<button data-s="error" onclick="show('error')">error</button>
<button data-s="suggest" onclick="show('suggest')">suggested</button>
<button data-s="draft" onclick="show('draft')">draft</button>
<button data-s="cload" onclick="show('cload')">suggest loading</button>
<button data-s="cempty" onclick="show('cempty')">suggest empty</button>
<button data-s="cerror" onclick="show('cerror')">suggest error</button>
</div>
<div class="banner">Proposal mockup — not on the live site. Example data only. Nothing is sent.</div>
<button class="menu" type="button" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Menu">Menu</button>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">Your Firm Name</div>
    <nav class="nav">
      <button class="on" data-nav="home" onclick="goNav('home')"><span class="ico">⌂</span> Home</button>
      <button data-nav="library" onclick="goNav('library')"><span class="ico">▦</span> Library</button>
      <button data-nav="campaigns" onclick="goNav('campaigns')"><span class="ico">✉</span> Campaigns</button>
      <button data-nav="settings" onclick="goNav('settings')"><span class="ico">⚙</span> Settings</button>
    </nav>
    <div class="sp"></div>
    <div class="who"><span class="av">JA</span><span>Jane Advisor</span></div>
  </aside>
  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const LIB={
  article:[
    {t:'How much TFSA room do you have left this year?',d:'A plain-language look at unused contribution room, and why it matters before year-end.'},
    {t:'A simple year-end money checklist',d:'Five short questions to ask before December 31.'},
    {t:'What a dollar-cost average can (and can’t) do',d:'A calm explainer for clients who invest a set amount each month.'}
  ],
  infographic:[
    {t:'RRSP deadline at a glance',d:'The key dates and contribution limits, in one shareable graphic.'},
    {t:'TFSA vs RRSP in one page',d:'A side-by-side graphic of the two most common registered accounts.'},
    {t:'The path to a year-end review',d:'Four steps, shown as a simple graphic.'}
  ],
  calculator:[
    {t:'Retirement savings calculator',d:'A simple way for clients to see whether they’re on track.'},
    {t:'TFSA room estimator',d:'Helps clients estimate leftover room before they contribute.'},
    {t:'RRSP refund estimator',d:'A rough illustration of tax savings from a contribution. Estimates only.'}
  ]
};
const TYPES=['article','infographic','calculator'];
const LAST={
  name:'November money update',
  subject:'Your November money update: TFSA room, the RRSP deadline, and a retirement check-in',
  sent:'Nov 4, 2026',
  open:'42.3%',
  click:'8.1%',
  delivered:'1,104',
  list:'Newsletter'
};
let view='home', purpose='', idx={article:0,infographic:0,calculator:0}, listen=false, lastSwap=-1;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2000)}
function greet(){const h=new Date().getHours();const p=h<12?'morning':h<17?'afternoon':'evening';return 'Good '+p+', Jane'}
function setSw(){
  const key=view;
  document.querySelectorAll('.mockbar [data-s]').forEach(b=>b.classList.toggle('on',b.getAttribute('data-s')===key));
}
function show(v){view=v;if(v==='home')purpose='';setNav('home');render()}
function setNav(n){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-nav')===n));document.getElementById('side').classList.remove('open')}
function goNav(n){
  setNav(n);
  if(n==='home'){show('home');return}
  if(n==='campaigns'){view='campaigns';render();return}
  view='other';
  document.getElementById('main').innerHTML=`<div class="empty"><h1>${n[0].toUpperCase()+n.slice(1)}</h1><p>This area is unchanged in this mock. Return home to see your numbers or write a campaign.</p><button class="btn primary" onclick="show('home')">Back to Home</button></div><p class="foot">Sample data only — Jane Advisor and library titles are placeholders.</p>`;
  setSw();
}
function writeCampaign(){
  const inp=document.getElementById('ask');
  if(inp)purpose=inp.value.trim();
  show('cload');
  setTimeout(()=>{ if(view==='cload') show('suggest'); }, 700);
}
function sayMic(){
  listen=!listen; render();
  if(!listen)return;
  setTimeout(()=>{
    purpose='A November money update for clients';
    listen=false;
    show('cload');
    setTimeout(()=>{ if(view==='cload') show('suggest'); }, 700);
  }, 800);
}
function swap(type){idx[type]=(idx[type]+1)%LIB[type].length;render()}
function swapNext(){lastSwap=(lastSwap+1)%TYPES.length;swap(TYPES[lastSwap])}
function piece(type,label){
  const p=LIB[type][idx[type]];
  return `<div class="piece"><span class="pill">${label}</span><div><h3>${p.t}</h3><p>${p.d}</p></div><button class="swap" type="button" onclick="swap('${type}')">Swap</button></div>`;
}
function foot(){return `<p class="foot">Sample data only — Jane Advisor and library titles are placeholders.</p>`}
function askBlock(){
  return `<form class="ask" onsubmit="writeCampaign();return false;">
      <input id="ask" aria-label="Ask FC" placeholder="Or tell us what this campaign is for…" value="${(purpose||'').replace(/"/g,'&quot;')}">
      <button class="mic${listen?' on':''}" type="button" aria-label="Speak to Ask FC" onclick="sayMic()">${listen?'●':'🎙'}</button>
    </form>
    <button class="cta" type="button" onclick="writeCampaign()">Write a campaign</button>
    <p class="hint">${listen?'Listening… (simulated)':'We’ll pick the best pieces from your library for you.'}</p>`;
}
function stripReady(){
  return `<div class="strip" role="list">
    <button class="stat" type="button" role="listitem" onclick="goNav('campaigns')"><div class="v">42.3%</div><div class="l">Open rate</div><div class="s">Last send · Nov 4</div></button>
    <button class="stat" type="button" role="listitem" onclick="goNav('campaigns')"><div class="v">1,284</div><div class="l">Subscribers</div><div class="s">All lists</div></button>
    <button class="stat" type="button" role="listitem" onclick="goNav('campaigns')"><div class="v">8.1%</div><div class="l">Click rate</div><div class="s">Last send · Nov 4</div></button>
    <button class="stat" type="button" role="listitem" onclick="goNav('campaigns')"><div class="v">3</div><div class="l">Sent this month</div><div class="s">November 2026</div></button>
  </div>`;
}
function stripEmpty(){
  return `<div class="strip" role="list">
    <button class="stat empty" type="button" role="listitem"><div class="v">—</div><div class="l">Open rate</div><div class="s">No sends yet</div></button>
    <button class="stat empty" type="button" role="listitem"><div class="v">0</div><div class="l">Subscribers</div><div class="s">No lists yet</div></button>
    <button class="stat empty" type="button" role="listitem"><div class="v">—</div><div class="l">Click rate</div><div class="s">No sends yet</div></button>
    <button class="stat empty" type="button" role="listitem"><div class="v">0</div><div class="l">Sent this month</div><div class="s">November 2026</div></button>
  </div>`;
}
function stripLoading(){
  return `<div class="strip">${[0,1,2,3].map(()=>'<div class="sk tile"></div>').join('')}</div>`;
}
function modReady(){
  return `<div class="mod">
    <p class="kicker">Last email</p>
    <h3>${LAST.subject}</h3>
    <p>Sent ${LAST.sent} to ${LAST.list} · ${LAST.delivered} delivered</p>
    <div class="meta"><span><b>${LAST.open}</b> open rate</span><span><b>${LAST.click}</b> click rate</span></div>
    <div class="row"><button class="btn ghost" type="button" onclick="goNav('campaigns')">View reports</button></div>
  </div>`;
}
function modEmpty(){
  return `<div class="mod">
    <p class="kicker">Your email</p>
    <h3>No campaigns sent yet</h3>
    <p>When you send your first email, open rate, clicks, and subscriber counts will show up here. You can still write a campaign from the library.</p>
  </div>`;
}
function homeShell(inner){
  return `<div class="home">
    <h1 class="greeting">${greet()}</h1>
    ${inner}
  </div>`+foot();
}
function render(){
  setSw();
  const main=document.getElementById('main');
  if(view==='cload'){main.innerHTML=`<div class="card"><div class="alert">Searching your library…</div></div>`+foot();return}
  if(view==='cempty'){main.innerHTML=`<div class="card"><div class="empty"><h2>No library pieces to suggest</h2><p>Add an article, infographic and calculator to the library, then try again.</p><button class="btn ghost" onclick="show('home')">Start over</button></div></div>`+foot();return}
  if(view==='cerror'){main.innerHTML=`<div class="card"><div class="bad"><h2>Couldn’t suggest a campaign</h2><p>Nothing was sent or saved.</p><button class="btn primary" onclick="writeCampaign()">Try again</button> <button class="btn ghost" onclick="show('home')">Start over</button></div></div>`+foot();return}
  if(view==='suggest'){
    main.innerHTML=`<div class="card">
      <p class="kicker">Suggested campaign</p>
      <p class="sublab">Subject line</p>
      <h2 class="subj">Your November money update: TFSA room, the RRSP deadline, and a retirement check‑in</h2>
      ${piece('article','Article')}
      ${piece('infographic','Infographic')}
      ${piece('calculator','Calculator')}
      <div class="actions">
        <button class="btn primary" onclick="show('draft')">Looks good — open draft</button>
        <button class="btn ghost" onclick="swapNext()">Swap a piece</button>
        <button class="btn ghost" onclick="show('home')">Start over</button>
      </div>
      <p class="note">Nothing is sent until you approve it.</p>
    </div>`+foot();return}
  if(view==='draft'){
    const a=LIB.article[idx.article],i=LIB.infographic[idx.infographic],c=LIB.calculator[idx.calculator];
    main.innerHTML=`<div class="card">
      <span class="status">Draft — not sent</span>
      <h2 class="subj">Your November money update: TFSA room, the RRSP deadline, and a retirement check‑in</h2>
      <p class="note">This draft is saved as a draft only. It has not been sent, scheduled, or sent for approval.</p>
      <div class="piece"><span class="pill">Article</span><div><h3>${a.t}</h3><p>${a.d}</p></div></div>
      <div class="piece"><span class="pill">Infographic</span><div><h3>${i.t}</h3><p>${i.d}</p></div></div>
      <div class="piece"><span class="pill">Calculator</span><div><h3>${c.t}</h3><p>${c.d}</p></div></div>
      <p class="note">[Placeholder — existing campaign footer / compliance copy, not invented legal text.]</p>
      <div class="actions">
        <button class="btn ghost" onclick="show('suggest')">Back to suggestion</button>
        <button class="btn ghost" onclick="show('home')">Start over</button>
      </div>
    </div>`+foot();return}
  if(view==='campaigns'){
    const has=true;
    main.innerHTML=`<div class="card" style="text-align:left">
      <p class="kicker">Campaigns</p>
      <h2 class="subj" style="font-size:22px;margin-bottom:8px">Reports</h2>
      <p class="note">Open rate is unique opens ÷ delivered (or sent). Same figures as Email Campaigns → Reports.</p>
      <div class="piece"><span class="pill">Sent</span><div><h3>${LAST.name}</h3><p>${LAST.subject}</p><p class="note">${LAST.sent} · ${LAST.list} · ${LAST.open} open · ${LAST.click} click</p></div></div>
      <div class="actions"><button class="btn ghost" onclick="show('home')">Back to Home</button></div>
    </div>`+foot();return}
  if(view==='loading'){
    main.innerHTML=homeShell(stripLoading()+`<div class="mod"><div class="sk lg"></div><div class="sk" style="margin-top:10px;width:90%"></div><div class="sk" style="margin-top:8px;width:50%"></div></div>`+askBlock());
    return;
  }
  if(view==='error'){
    main.innerHTML=homeShell(`<div class="errbox"><h3>Couldn’t load your numbers</h3><p>Your home is still here. Nothing was changed.</p><button class="btn primary" type="button" onclick="show('loading');setTimeout(()=>show('home'),700)">Try again</button></div>`+askBlock());
    return;
  }
  if(view==='empty'){
    main.innerHTML=homeShell(stripEmpty()+modEmpty()+askBlock());
    return;
  }
  main.innerHTML=homeShell(stripReady()+modReady()+askBlock());
}
(function boot(){
  const q=location.search;
  const m=q.match(/[?&]s=([a-z]+)/);
  if(m)view=m[1];
  if(/[?&]phone/.test(q)){/* viewport handled by screenshots */}
  render();
})();
</script>
</body>
</html>
