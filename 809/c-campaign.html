</style></head><body><div class="mockbar"><a href="../">All mocks</a> · #809 Send for multiple advisors · <a href="index.html">Hub</a> · <a href="today.html">Today</a> · <a href="a-wizard.html">A: Step by step</a> · <a href="b-table.html">B: Table first</a> · <b>C: Campaign first</b> · <a href="build-contract.html">Contract</a><span class="sp"></span><span class="grp"><button data-dev="desk" onclick="setDev('desk')">Desktop</button><button data-dev="phone" onclick="setDev('phone')">Phone</button></span><span class="row2">State: <button data-sb="s:ready" onclick="set('s','ready')">ready</button><button data-sb="s:loading" onclick="set('s','loading')">loading</button><button data-sb="s:empty" onclick="set('s','empty')">empty</button><button data-sb="s:error" onclick="set('s','error')">error</button><button data-sb="s:sending" onclick="set('s','sending')">sending</button><button data-sb="s:done" onclick="set('s','done')">done</button><button data-sb="s:partial" onclick="set('s','partial')">done, 1 failed</button> &nbsp;Confirm: <button data-sb="cf:0" onclick="set('cf','0')">closed</button><button data-sb="cf:1" onclick="set('cf','1')">open</button></span></div><div id="dev" class="desk"><div class="x-app"><nav class="x-nav"><b>Admin</b><span>Users</span><span>Manage advisor posts</span><span>Post for multiple advisors</span><span class="on">Send email for multiple advisors</span><span>Weekly Picks</span></nav><div class="x-main"><div id="flow"></div></div></div></div><div class="toast" id="toast"></div><script>
var S=S||{};function qs(s){return document.querySelectorAll(s)}
function setDev(d){document.getElementById('dev').className=d;qs('[data-dev]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-dev')===d)})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},2800)}
function apply(){Object.keys(S).forEach(function(k){qs('[data-'+k+']').forEach(function(e){e.style.display=e.getAttribute('data-'+k).split(' ').indexOf(String(S[k]))>-1?'':'none'})});
 qs('[data-sb]').forEach(function(b){var p=b.getAttribute('data-sb').split(':');b.classList.toggle('on',String(S[p[0]])===p[1])});
 if(window.onApply)onApply();}
function set(k,v){S[k]=v;apply();var d=document.getElementById('dev');if(k==='v'){d.scrollTop=0;window.scrollTo(0,0)}}
function openOv(id){document.getElementById(id).classList.add('show')}function closeOv(id){document.getElementById(id).classList.remove('show')}
function initBase(){var q=location.search;setDev(/[?&]phone/.test(q)?'phone':'desk');Object.keys(S).forEach(function(k){var m=q.match(new RegExp('[?&]'+k+'=([a-z0-9]+)'));if(m)S[k]=m[1]});apply()}
S={s:'ready',cf:'0',pv:''};var DIR='c';var ADV=[
 {id:'jane',n:'Jane Advisor',f:'Your Firm Name',e:'jane@yourfirm.ca',lists:[['Clients',142]],cm:'off',ok:1,c:'#1f7a66',ini:'YF',addr:'100 Example St, Vancouver, BC'},
 {id:'john',n:'John Advisor',f:'Example Wealth',e:'john@example.com',lists:[['Clients',88],['Prospects',40]],cm:'email',ok:1,c:'#2b4c7e',ini:'EW',addr:'200 Sample Ave, Calgary, AB'},
 {id:'casey',n:'Casey Example',f:'Example Planning',e:'casey@example.com',lists:[['Clients',61]],cm:'off',ok:0,why:'No mailing address (CASL)',c:'#7a4f1f',ini:'EP'},
 {id:'sam',n:'Sam Example',f:'Sample Advisory',e:'sam@example.com',lists:[],cm:'off',ok:0,why:'No email list',c:'#5e35b1',ini:'SA'},
 {id:'pat',n:'Pat Example',f:'Your Firm Name',e:'pat@yourfirm.ca',lists:[['Clients',210]],cm:'off',ok:1,c:'#1f7a66',ini:'YF',addr:'100 Example St, Vancouver, BC'},
 {id:'lee',n:'Lee Example',f:'Example Partners',e:'lee@example.com',lists:[['Newsletter',95]],cm:'external',ok:1,c:'#8e2c48',ini:'EP',addr:'300 Demo Rd, Toronto, ON'}];
var CAMPS=[['nov','Sample Campaign: November market update'],['tax','Sample Campaign: Year-end tax tips']];
var SEL={jane:1,john:1,casey:1,pat:1,lee:1};
function A(id){return ADV.filter(function(a){return a.id===id})[0]}
function selList(){return ADV.filter(function(a){return SEL[a.id]})}
function what(a){if(!a.ok)return ['bl','Can\u2019t send: '+a.why];if(a.cm!=='off')return ['wa','Goes to the advisor to approve'];return ['ok','Sends now']}
function result(a){if(!a.ok)return ['bl','Blocked: '+a.why];if(a.cm!=='off')return ['wa','Waiting for approval'];if(a.id==='pat'&&S.s==='partial')return ['bl','Failed: sending service error. Retry'];return ['ok','Sent to '+a.lists[0][1]+' people']}
function pill(p){return '<span class="x-pill '+p[0]+'">'+p[1]+'</span>'}
function ready(a){return a.ok?(a.cm!=='off'?'<span class="x-pill wa">Approval required</span>':'<span class="x-pill ok">Ready</span>'):'<span class="x-pill bl">'+a.why+'</span>'}
function listSel(a){if(!a.lists.length)return '<span class="x-mut">No list</span>';return '<select class="x-sel" aria-label="List for '+a.n+'">'+a.lists.map(function(l){return '<option>'+l[0]+' ('+l[1]+')</option>'}).join('')+'</select>'}
function campSel(){return '<select class="x-sel" aria-label="Campaign">'+CAMPS.map(function(c){return '<option>'+c[1]+'</option>'}).join('')+'</select>'}
function toggle(id){SEL[id]=SEL[id]?0:1;render()}
function all(v){ADV.forEach(function(a){SEL[a.id]=v});render()}
function search(){return '<div class="x-sr"><input class="x-in" placeholder="Search by name, email, firm or tag" aria-label="Search advisors"><select class="x-sel" aria-label="Filter"><option>All advisors</option><option>Ready</option><option>Approval required</option><option>Can\u2019t send</option></select></div>'}
function pickRows(withCamp){var h='<div class="x-tbl"><div class="x-tr x-th"><span><input type="checkbox" aria-label="Select all" onchange="all(this.checked?1:0)" '+(selList().length===ADV.length?'checked':'')+'></span><span>Advisor</span>'+(withCamp?'<span>Campaign</span>':'')+'<span>List</span><span>Status</span></div>';
 ADV.forEach(function(a){h+='<label class="x-tr'+(SEL[a.id]?' on':'')+'"><span><input type="checkbox" '+(SEL[a.id]?'checked':'')+' onchange="toggle(\''+a.id+'\')" aria-label="'+a.n+'"></span><span><b>'+a.n+'</b><small>'+a.f+' &middot; '+a.e+'</small></span>'+(withCamp?'<span>'+campSel()+'</span>':'')+'<span>'+listSel(a)+'</span><span>'+ready(a)+'</span></label>'});return h+'</div>'}
function preview(a){a=a||A(S.pv)||selList()[0];if(!a)return '';
 return '<div class="x-em"><div class="x-emh" style="background:'+a.c+'"><span class="x-lg">'+a.ini+'</span>'+a.f+'</div><div class="x-emb"><div class="x-emt">November market update</div><p>Hi {First name},</p><p>Markets moved a lot this month. Here are three things worth knowing before year-end, and what they mean for your plan.</p><span class="x-emc" style="background:'+a.c+'">Read the update</span><p class="x-ems">'+a.n+' &middot; '+a.f+'<br>'+(a.addr||'<span class="x-miss">Mailing address missing</span>')+'<br><u>Unsubscribe</u></p></div></div>'}
function pvTabs(){return '<div class="x-pvt">'+selList().map(function(a){var on=(S.pv===a.id)||(!A(S.pv)&&a===selList()[0]);return '<button class="'+(on?'on':'')+'" onclick="S.pv=\''+a.id+'\';render()">'+a.n.split(' ')[0]+'</button>'}).join('')+'</div>'}
function confirmTbl(){var h='<div class="x-tbl cf"><div class="x-tr x-th"><span>Advisor</span><span>List</span><span>People</span><span>What happens</span></div>';
 selList().forEach(function(a){h+='<div class="x-tr"><span><b>'+a.n+'</b><small>'+a.f+'</small></span><span>'+(a.lists[0]?a.lists[0][0]:'&mdash;')+'</span><span>'+(a.ok&&a.lists[0]?a.lists[0][1]:'&mdash;')+'</span><span>'+pill(what(a))+'</span></div>'});return h+'</div>'}
function counts(){var s=selList(),n=s.filter(function(a){return a.ok&&a.cm==='off'}),w=s.filter(function(a){return a.ok&&a.cm!=='off'}),b=s.filter(function(a){return !a.ok});
 var ppl=n.reduce(function(t,a){return t+a.lists[0][1]},0);return {n:n.length,w:w.length,b:b.length,ppl:ppl}}
function sendBtn(){var c=counts();return '<button class="x-btn" onclick="set(\'s\',\'sending\');setTimeout(function(){set(\'s\',\'done\')},900)">Send for '+(c.n+c.w)+' advisors</button>'}
function sumLine(){var c=counts();return '<div class="x-sum"><span>'+pill(['ok',c.n+' send now ('+c.ppl+' people)'])+'</span><span>'+pill(['wa',c.w+' go to the advisor to approve'])+'</span>'+(c.b?'<span>'+pill(['bl',c.b+' can\u2019t send'])+'</span>':'')+'</div>'}
function results(){var h='<div class="x-al ok">'+(S.s==='partial'?'Done, with 1 failure.':'Done.')+' Each advisor&rsquo;s campaign is in their Email Campaigns with the result below.</div><div class="x-tbl cf"><div class="x-tr x-th"><span>Advisor</span><span>List</span><span>Result</span><span></span></div>';
 selList().forEach(function(a){var r=result(a);h+='<div class="x-tr"><span><b>'+a.n+'</b><small>'+a.f+'</small></span><span>'+(a.lists[0]?a.lists[0][0]:'&mdash;')+'</span><span>'+pill(r)+'</span><span>'+(r[1].indexOf('Retry')>-1?'<button class="x-btn o sm" onclick="toast(\'Retrying Pat Example\')">Retry</button>':(a.ok?'<button class="x-lk" onclick="toast(\'Opens the campaign\')">View</button>':'<button class="x-lk" onclick="toast(\'Opens the advisor settings\')">Fix</button>'))+'</span></div>'});
 return h+'</div><div class="x-foot"><button class="x-btn o" onclick="set(\'s\',\'ready\');set(\'step\',\'1\')">Start another send</button></div>'}
function stateBlock(){if(S.s==='loading')return '<div class="x-load"><span class="x-spin"></span>Loading advisors&hellip;</div>';
 if(S.s==='empty')return '<div class="x-empty"><b>No advisors yet</b><p>Advisors with an email list show up here.</p></div>';
 if(S.s==='error')return '<div class="x-al er">Couldn&rsquo;t load advisors. <button class="x-btn o sm" onclick="set(\'s\',\'ready\')">Try again</button></div>';
 if(S.s==='sending')return '<div class="x-load"><span class="x-spin"></span>Sending for '+(counts().n+counts().w)+' advisors&hellip; you can leave this page.</div>';
 return null}
/* ---- A: wizard ---- */
function wizard(){var st=+S.step,steps=['Advisors','Campaign','Review','Done'];var done=S.s==='done'||S.s==='partial';if(done)st=4;
 var h='<div class="x-steps">'+steps.map(function(s,i){var k=i+1;return '<span class="'+(k<st?'d':k===st?'n':'')+'">'+(k<st?'&#10003;':k)+' '+s+'</span>'}).join('')+'</div>';
 var b=stateBlock();if(b&&S.s!=='sending')return h+b;
 if(S.s==='sending')return h+b;
 if(done)return h+results();
 if(st===1)h+='<div class="x-card">'+search()+pickRows(false)+'</div><div class="x-bar"><span>'+selList().length+' selected</span><button class="x-btn" onclick="set(\'step\',\'2\')"'+(selList().length?'':' disabled')+'>Next</button></div>';
 if(st===2)h+='<div class="x-card"><div class="x-f"><label>Campaign</label>'+campSel()+'</div><div class="x-f"><label>When</label><div class="x-rad"><label><input type="radio" name="w" checked> Send now</label><label><input type="radio" name="w"> Schedule</label></div></div><div class="x-h">Lists</div>'+selList().map(function(a){return '<div class="x-lr"><span>'+a.n+'</span>'+listSel(a)+'</div>'}).join('')+'</div><div class="x-bar"><button class="x-btn o" onclick="set(\'step\',\'1\')">Back</button><span class="sp"></span><button class="x-btn" onclick="set(\'step\',\'3\')">Review</button></div>';
 if(st===3)h+='<div class="x-two"><div class="x-card"><div class="x-h">Preview</div>'+pvTabs()+preview()+'</div><div class="x-card"><div class="x-h">Who gets what</div>'+sumLine()+confirmTbl()+'</div></div><div class="x-bar"><button class="x-btn o" onclick="set(\'step\',\'2\')">Back</button><span class="sp"></span>'+sendBtn()+'</div>';
 return h}
/* ---- B: table-first ---- */
function table(){var b=stateBlock();var h='';
 if(b)return search()+b;
 if(S.s==='done'||S.s==='partial')return results();
 h+='<div class="x-card">'+search()+pickRows(true)+'</div>';
 h+='<div class="x-bar sticky"><b>'+selList().length+' selected</b><span class="sp"></span><button class="x-btn o" onclick="set(\'dr\',\'1\')">Preview</button><button class="x-btn" onclick="set(\'dr\',\'1\')">Review and send</button></div>';
 if(S.dr==='1')h+='<div class="x-scrim" onclick="set(\'dr\',\'0\')"></div><aside class="x-drawer" role="dialog" aria-label="Review and send"><div class="x-dh"><b>Review and send</b><button class="x-x" aria-label="Close" onclick="set(\'dr\',\'0\')">&times;</button></div>'+sumLine()+confirmTbl()+'<div class="x-h">Preview</div>'+pvTabs()+preview()+'<div class="x-foot">'+sendBtn()+'</div></aside>';
 return h}
/* ---- C: campaign-first ---- */
function campaign(){var b=stateBlock();var h='';
 h+='<div class="x-cps">'+CAMPS.map(function(c,i){return '<button class="x-cp'+(i===0?' on':'')+'"><span class="x-cpt">'+c[1]+'</span><small>'+(i===0?'Library email &middot; updated Nov 3':'Library email &middot; updated Oct 28')+'</small></button>'}).join('')+'</div>';
 if(b)return h+b;
 if(S.s==='done'||S.s==='partial')return h+results();
 h+='<div class="x-two"><div class="x-card"><div class="x-h">Send to</div>'+search()+'<div class="x-fan">'+ADV.map(function(a){return '<label class="x-fr'+(SEL[a.id]?' on':'')+'"><input type="checkbox" '+(SEL[a.id]?'checked':'')+' onchange="toggle(\''+a.id+'\')" aria-label="'+a.n+'"><span><b>'+a.n+'</b><small>'+a.f+'</small></span>'+listSel(a)+ready(a)+'<button type="button" class="x-lk" onclick="S.pv=\''+a.id+'\';render()">Preview</button></label>'}).join('')+'</div></div><div class="x-card"><div class="x-h">Preview: '+((A(S.pv)||selList()[0]||ADV[0]).n)+'</div>'+preview()+'</div></div>';
 h+='<div class="x-bar"><span>'+sumLine()+'</span><span class="sp"></span><button class="x-btn" onclick="set(\'cf\',\'1\')">Send for '+(counts().n+counts().w)+' advisors</button></div>';
 if(S.cf==='1')h+='<div class="x-scrim" onclick="set(\'cf\',\'0\')"></div><div class="x-dlg" role="dialog" aria-label="Confirm send"><div class="x-dh"><b>Send Sample Campaign: November market update?</b><button class="x-x" aria-label="Close" onclick="set(\'cf\',\'0\')">&times;</button></div>'+confirmTbl()+'<div class="x-foot"><button class="x-btn o" onclick="set(\'cf\',\'0\')">Cancel</button>'+sendBtn()+'</div></div>';
 return h}
function render(){var t={a:['Send email for multiple advisors',wizard],b:['Send email for multiple advisors',table],c:['Send email for multiple advisors',campaign]}[DIR];
 document.getElementById('flow').innerHTML='<h1 class="x-h1">'+t[0]+'</h1>'+t[1]()}
window.onApply=render;var _sd=setDev;setDev=function(d){_sd(d);render()};
