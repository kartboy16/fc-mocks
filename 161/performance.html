<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Performance · Ads</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">FC<span>FinancialContent</span></div>
    <div id="sidebarNav"></div>
    <div class="sidebar-spacer"></div>
    <div class="nav-profile">JL</div>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-search">
        <span>🔍</span>
        <input type="search" placeholder="Search…" disabled>
      </div>
      <div class="topbar-actions">
        <a class="wallet-chip" href="funding.html" id="walletChip">💰 $2,450 CAD</a>
      </div>
    </header>
    <main class="content">
      <div class="toolbar-row">
        <div>
          <h1 class="page-title">Performance</h1>
          <p class="page-sub" id="pageSub">Rollup and per-campaign KPIs</p>
        </div>
        <a class="btn btn-secondary" href="index.html">← Ads home</a>
      </div>

      <div class="demo-bar">
        <strong>Demo:</strong>
        <button type="button" class="btn btn-sm btn-secondary" id="btnSkeleton">Toggle loading skeleton</button>
        <button type="button" class="btn btn-sm btn-secondary" id="btnError">Toggle error banner</button>
      </div>

      <div id="errorBanner" class="banner banner-error">Unable to load metrics (demo). Check connection and retry.</div>

      <div id="skeleton" class="skeleton">
        <div class="kpi-grid">
          <div class="skel-card"><div class="skel-line" style="width:40%"></div><div class="skel-line" style="width:70%;height:28px"></div></div>
          <div class="skel-card"><div class="skel-line" style="width:40%"></div><div class="skel-line" style="width:70%;height:28px"></div></div>
          <div class="skel-card"><div class="skel-line" style="width:40%"></div><div class="skel-line" style="width:70%;height:28px"></div></div>
          <div class="skel-card"><div class="skel-line" style="width:40%"></div><div class="skel-line" style="width:70%;height:28px"></div></div>
        </div>
        <div class="skel-card" style="height:200px"><div class="skel-line" style="width:30%"></div></div>
      </div>

      <div id="perfBody">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="rollup">All campaigns</button>
          <button type="button" class="tab" data-tab="pick">Per campaign</button>
        </div>

        <div id="campSelectWrap" class="hidden" style="margin-bottom:16px">
          <label class="form-label" for="campSelect">Campaign</label>
          <select class="form-control" id="campSelect" style="max-width:360px"></select>
        </div>

        <div class="kpi-grid" id="kpiGrid"></div>

        <div class="chart-placeholder" aria-hidden="true">
          <div class="chart-bars">
            <span style="height:40%"></span><span style="height:65%"></span><span style="height:50%"></span>
            <span style="height:80%"></span><span style="height:55%"></span><span style="height:90%"></span>
            <span style="height:70%"></span><span style="height:45%"></span>
          </div>
          <div>Chart placeholder · spend &amp; leads over time</div>
        </div>

        <div class="card card-pad" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <div>
            <div style="font-weight:700;margin-bottom:4px">Leads</div>
            <div style="font-size:13px;color:var(--muted)">Synced to Contacts when captured from landing or Meta forms.</div>
          </div>
          <a class="btn btn-primary" href="#" id="viewLeads" onclick="event.preventDefault();FCAds.showToast('Contacts stub — leads would open here','success')">View leads in Contacts</a>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
<script>
(function () {
  document.getElementById('sidebarNav').innerHTML = FCAds.shellNav('reports');
  document.getElementById('walletChip').textContent = '💰 ' + FCAds.fmtCAD(FCAds.getWallet());

  var mode = 'rollup';
  var selectedId = FCAds.qs('id');

  function liveCamps() {
    return FCAds.loadCampaigns().filter(function (c) {
      return c.status === 'live' || c.status === 'paused';
    });
  }

  function metricsFor(list) {
    var spend = 0, leads = 0, impressions = 0, clicks = 0;
    list.forEach(function (c) {
      spend += c.spend || 0;
      leads += c.leads || 0;
      // Fake derived metrics proportional to spend
      impressions += Math.round((c.spend || 0) * 42 + (c.leads || 0) * 180);
      clicks += Math.round((c.spend || 0) * 1.8 + (c.leads || 0) * 3);
    });
    var ctr = impressions ? ((clicks / impressions) * 100) : 0;
    var cpl = leads ? (spend / leads) : 0;
    return { spend: spend, impressions: impressions, clicks: clicks, ctr: ctr, leads: leads, cpl: cpl };
  }

  function renderKpis(m) {
    var items = [
      { label: 'Spend', value: FCAds.fmtMoney(m.spend), delta: 'CAD' },
      { label: 'Impressions', value: m.impressions.toLocaleString('en-CA'), delta: '+12% vs prior' },
      { label: 'Clicks', value: m.clicks.toLocaleString('en-CA'), delta: '+8%' },
      { label: 'CTR', value: m.ctr.toFixed(2) + '%', delta: '' },
      { label: 'Leads', value: String(m.leads), delta: 'Contacts' },
      { label: 'CPL', value: m.leads ? FCAds.fmtMoney(m.cpl) : '—', delta: 'CAD' }
    ];
    document.getElementById('kpiGrid').innerHTML = items.map(function (it) {
      return (
        '<div class="kpi-card">' +
          '<div class="kpi-label">' + it.label + '</div>' +
          '<div class="kpi-value">' + it.value + '</div>' +
          (it.delta ? '<div class="kpi-delta">' + it.delta + '</div>' : '') +
        '</div>'
      );
    }).join('');
  }

  function fillSelect() {
    var sel = document.getElementById('campSelect');
    var list = liveCamps();
    sel.innerHTML = list.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === selectedId ? ' selected' : '') + '>' + c.name + '</option>';
    }).join('');
    if (!selectedId && list[0]) selectedId = list[0].id;
  }

  function render() {
    fillSelect();
    var list = liveCamps();
    if (mode === 'pick') {
      document.getElementById('campSelectWrap').classList.remove('hidden');
      list = list.filter(function (c) { return c.id === selectedId; });
      var c = list[0];
      document.getElementById('pageSub').textContent = c ? (c.name + ' · ' + FCAds.statusLabel(c.status)) : 'No campaign selected';
    } else {
      document.getElementById('campSelectWrap').classList.add('hidden');
      document.getElementById('pageSub').textContent = 'Rollup across live & paused campaigns';
    }
    renderKpis(metricsFor(list.length ? list : [{ spend: 0, leads: 0 }]));
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      mode = t.getAttribute('data-tab');
      render();
    });
  });

  document.getElementById('campSelect').addEventListener('change', function () {
    selectedId = this.value;
    render();
  });

  document.getElementById('btnSkeleton').addEventListener('click', function () {
    var sk = document.getElementById('skeleton');
    var body = document.getElementById('perfBody');
    var on = !sk.classList.contains('show');
    sk.classList.toggle('show', on);
    body.classList.toggle('hidden', on);
    this.textContent = on ? 'Hide skeleton' : 'Toggle loading skeleton';
  });

  document.getElementById('btnError').addEventListener('click', function () {
    var b = document.getElementById('errorBanner');
    b.classList.toggle('show');
    this.textContent = b.classList.contains('show') ? 'Hide error banner' : 'Toggle error banner';
  });

  if (selectedId) {
    mode = 'pick';
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === 'pick');
    });
  }
  render();
})();
</script>
</body>
</html>
