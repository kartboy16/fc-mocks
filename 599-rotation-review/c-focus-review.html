 return '<div class="post'+cls+'"><div class="thumb'+(opts.lg?' lg':'')+'">IMG</div><div class="body"><div class="ttl">'+p.title+'</div><div>'+chip(p.topic)+' '+itemBadge(it.st,it)+' <span class="muted">fit '+p.score+'</span></div>'+dateLine(p)+(it.st==='needsupdate'?nuBox(p,' <b>It can\'t be approved or scheduled until the post is refreshed.</b> Swap it, or leave it skipped.'):'<div class="reason"><b>Why this pick:</b> '+p.why+'</div>')+(it.st==='scheduled'?'<div class="muted" style="color:#00695c">Goes live on '+a.name+'\'s website '+fmtT(it.at)+'. You can change or unschedule it until then.</div>':'')+bk+'</div><div class="acts">'+acts+'</div></div>';}).join('');}
function leftOut(a){if(!a.left.length)return '';return '<div class="leftout"><b>Skipped at build: needs update ('+a.left.length+')</b><div class="muted">These would have fit '+a.name+', but they\'re flagged as out of date, so the engine skipped them. They come back once the post is refreshed.</div>'+a.left.map(function(id){var p=lib(id);return '<div class="row"><div class="thumb">IMG</div><div style="flex:1"><b>'+p.title+'</b> '+chip(p.topic)+dateLine(p)+nuBox(p)+'</div></div>';}).join('')+'</div>';}
function slateHead(a){return '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><div style="flex:1;min-width:220px"><h1 style="margin:0">'+a.name+' <span class="muted" style="font-size:14px">'+a.firm+'</span></h1><div style="margin-top:4px">This month\'s topic: '+chip(a.month)+' &nbsp;<span class="hist">Last 3 months: '+histChips(a)+'</span></div><div>'+warns(a)+'</div></div><div>'+stBadge(slateStatus(a))+(schedCount(a)?'<div class="muted">'+schedCount(a)+' of '+a.items.length+' scheduled</div>':'')+'</div></div>';}
function slateActions(){return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn ok" onclick="approveAll()">Approve all</button><button class="btn pri" onclick="schedSlate()">Schedule all&hellip;</button><button class="btn" onclick="skipWeek()">Skip this week</button><button class="btn" onclick="toast(\'Rebuilding this advisor\\\'s slate. Approved picks are kept.\')">Rebuild this slate</button><span style="flex:1"></span><span class="muted" style="align-self:center">Approve marks a pick OK. Schedule sets the date and time (and approves). Nothing publishes on its own.</span></div>';}
function warnHelp(a){if(a.warn.indexOf('Missing products/services')>=0)return '<div class="err" style="background:#fff8e1;border-color:#f0d98a;color:#6d5300"><b>No products or services on file.</b> Picks are based on topic rotation only. <a href="#" onclick="toast(\'Opens the advisor\\\'s Services panel (existing screen).\');return false">Add services</a></div>';
 if(a.warn.indexOf('Streak override')>=0)return '<div class="err" style="background:#fff8e1;border-color:#f0d98a;color:#6d5300"><b>Third month of Group benefits.</b> Nothing else fit this advisor\'s products and services, so the usual block was lifted. Swap if you have a better fit.</div>';
 if(a.warn.indexOf('Thin fit')>=0)return '<div class="err" style="background:#fff8e1;border-color:#f0d98a;color:#6d5300"><b>Few good matches.</b> Only a handful of library posts fit this advisor\'s services and haven\'t run before. Check the picks closely.</div>';return '';}
function assumeCount(){return assumeSched()+'<div class="assume"><b class="t">Assumption</b>Sample shows 3 picks per advisor so "Partly approved" makes sense. The spec says <i>one top pick plus 2 backups</i> per advisor. Confirm the number of picks per advisor per week.</div>';}


function queueC(){var c=counts();var h='<h1>Weekly picks review</h1>'+weekLine()+rulesBanner()+oq('Delivery of the review queue')+oqAdvisors();
 if(UI.state==='loading')return h+loadingBlock();if(UI.state==='empty')return h+emptyBlock();if(UI.state==='error')return h+errorBlock();if(UI.state==='success')h+=successBlock();
 var left=c.pending+c.partly;h+='<div class="card" style="padding:20px;text-align:center"><div style="font-size:34px;font-weight:800">'+left+' of '+ADV.length+'</div><div>advisor slates still need a look</div><div class="muted" style="color:#00695c"><a href="#" onclick="UI.fStatus=\'scheduled\';render();return false">'+c.scheduled+' fully scheduled</a> &middot; '+c.approved+' approved, not all scheduled</div><div class="muted" style="margin-top:4px;color:#a14d00">'+(nuCount()+leftCount())+' posts skipped this week because they need an update. <a href="#" onclick="UI.fWarn=\'nu\';render();return false">Show those advisors</a></div><div style="height:10px;background:#eef1f4;border-radius:6px;margin:12px auto;max-width:420px;overflow:hidden"><div style="height:100%;width:'+Math.round(100*(ADV.length-left)/ADV.length)+'%;background:#2e7d32"></div></div><button class="btn pri" style="font-size:15px;padding:10px 20px" onclick="startC()">'+(left?'Start reviewing':'Review again')+'</button> <button class="btn" onclick="bulkApproveNoWarn()">Approve all with no warnings</button></div>';
 h+='<h2>Filter what you step through</h2><div class="card">'+filterBar()+'</div><h2>Advisors this week</h2><div class="card">';
 var rows=filtered();if(!rows.length)h+='<div class="empty">No advisors match these filters.</div>';
 rows.forEach(function(a){var nsel=UI.sel[a.id];h+='<div style="display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid #eef1f4;align-items:center;cursor:pointer" onclick="go(\'slate\',\''+a.id+'\')"><input type="checkbox" '+(nsel?'checked':'')+' onclick="event.stopPropagation();UI.sel[\''+a.id+'\']=this.checked;render()"><b style="min-width:150px">'+a.name+'</b><span class="hide-m">'+chip(a.month)+'</span><span style="flex:1">'+warns(a)+rowSched(a)+(a.left.length?'<span class="st st-needsupdate">'+a.left.length+' skipped at build: needs update</span>':'')+'</span>'+stBadge(slateStatus(a),a)+'</div>';});
 var n=Object.keys(UI.sel).filter(function(k){return UI.sel[k]}).length;if(n)h+='<div class="bulk"><b>'+n+' selected</b><button class="btn sm ok" onclick="bulkApprove()">Approve selected</button><button class="btn sm pri" onclick="schedSelected()">Schedule selected&hellip;</button><button class="btn sm" onclick="bulkSkip()">Skip selected this week</button></div>';
 return h+'</div>';}
function startC(){var rows=filtered();var f=rows.filter(function(a){var s=slateStatus(a);return s==='pending'||s==='partly';})[0]||rows[0];if(f)go('slate',f.id);}
function nextC(){var rows=filtered();var i=rows.indexOf(adv(UI.cur));var n=rows[i+1];if(n)go('slate',n.id);else{toast('That was the last advisor in this list.');go('queue');}}
function inlineSwap(){var a=adv(UI.cur),it=a.items[UI.swapItem];return '<div style="background:#f5faff;border:1px solid #b9dafb;border-radius:10px;padding:12px;margin:0 12px 12px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="flex:1">Swap "'+lib(it.post).title+'" for:</b>'+swapSearch()+'</div><div class="muted">Backups 1 and 2 first, then other options ranked by fit.</div><div id="swl" style="max-height:360px;overflow:auto">'+swapRows()+'</div><div style="display:flex;gap:8px;justify-content:flex-end"><span class="muted" style="flex:1;align-self:center">The new pick still needs approval.</span><button class="btn" onclick="closeSwap()">Cancel</button><button class="btn pri" '+(UI.swapSel?'':'disabled')+' onclick="confirmSwap()">Confirm swap</button></div></div>';}
function slateC(){var a=adv(UI.cur);var rows=filtered();var i=rows.indexOf(a);
 var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><a href="#" onclick="go(\'queue\');return false">&larr; Overview</a><span class="muted">Advisor '+(i+1)+' of '+rows.length+'</span><span><button class="btn sm" '+(i>0?'':'disabled')+' onclick="go(\'slate\',\''+(rows[i-1]||{}).id+'\')">&larr; Prev</button> <button class="btn sm" onclick="nextC()">Next &rarr;</button></span></div>';
 h+='<div class="card" style="padding:16px">'+slateHead(a)+rulesBanner()+warnHelp(a);
 if(UI.state==='loading')return h+loadingBlock()+'</div>';if(UI.state==='error')return h+errorBlock()+'</div>';
 h+=assumeCount()+'</div><div class="card" style="margin-top:12px">';
 var posts=slatePosts(a,{lg:true}).split('<div class="post');posts.shift();
 posts.forEach(function(p,j){h+='<div class="post'+p;if(UI.view2==='swap'&&UI.swapItem===j)h+=inlineSwap();});
 h+='</div>'+leftOut(a)+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0"><button class="btn ok" style="font-size:15px;padding:9px 18px" onclick="approveAll();nextC()">Approve all and next</button><button class="btn" onclick="skipWeek();nextC()">Skip this week and next</button><button class="btn ghost" onclick="nextC()">Leave for later</button></div><p class="muted">Keyboard: A approve all, S skip week, &rarr; next, &larr; previous.</p>'+oq('What happens after Approve');return h;}
function render(){document.getElementById('main').innerHTML=UI.view==='queue'?queueC():slateC();document.getElementById('crumbx').innerHTML=UI.view==='slate'?' &rsaquo; '+adv(UI.cur).name:'';markBar();}
document.addEventListener('keydown',function(e){if(UI.view!=='slate'||/INPUT|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight')nextC();if(e.key==='ArrowLeft'){var r=filtered(),i=r.indexOf(adv(UI.cur));if(i>0)go('slate',r[i-1].id);}if(e.key==='a'){approveAll();nextC();}if(e.key==='s'){skipWeek();nextC();}});

document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="ov2" style="z-index:70" onclick="closeSched()"></div><div class="modal" id="sm" style="z-index:80"></div>');
document.getElementById('mb').innerHTML=mockbar('C','One advisor at a time, inline swap');render();
</script></body></html>
